<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d17">
  <meta name="description" content="ذكاء — مساعد ذكاء اصطناعي عربي للكتابة والتحليل والإبداع والبرمجة.">
  <title>ذكاء — مساعدك الذكي</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

    <aside class="sidebar" id="sidebar" aria-label="الشريط الجانبي">
      <a class="brand" href="#" aria-label="ذكاء">
        <span class="brand-orb" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5c.7 3.9 1.9 5.1 5.8 5.8-3.9.7-5.1 1.9-5.8 5.8-.7-3.9-1.9-5.1-5.8-5.8 3.9-.7 5.1-1.9 5.8-5.8Z" fill="currentColor"/><path d="M18.5 14.2c.35 1.95.95 2.55 2.9 2.9-1.95.35-2.55.95-2.9 2.9-.35-1.95-.95-2.55-2.9-2.9 1.95-.35 2.55-.95 2.9-2.9Z" fill="currentColor" opacity=".7"/></svg>
        </span>
        <span class="brand-text">ذكاء <em>AI</em></span>
      </a>

      <button class="new-chat" id="newChat" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        محادثة جديدة
      </button>

      <div class="history">
        <div class="history-label">المحادثات الأخيرة</div>
        <nav id="historyList" aria-label="المحادثات">
          <button class="history-item" type="button" data-conversation="launch">
            <span class="history-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3c3.5 2 5 5 5 9l-5 3-5-3c0-4 1.5-7 5-9Z"/><path d="M9.5 15.5 8 21l4-2 4 2-1.5-5.5"/></svg></span>
            <span class="history-copy"><strong>خطة إطلاق منتج</strong><small>اليوم · 12 رسالة</small></span>
          </button>
          <button class="history-item" type="button" data-conversation="sales">
            <span class="history-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V5M4 19h16"/><path d="m7 15 3.5-4 3 2.5L20 7"/></svg></span>
            <span class="history-copy"><strong>تحليل بيانات المبيعات</strong><small>أمس · 8 رسائل</small></span>
          </button>
          <button class="history-item" type="button" data-conversation="content">
            <span class="history-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.9V17h5v-1.2c0-.8.4-1.5 1-1.9A6 6 0 0 0 12 3Z"/><path d="M9.5 20h5"/></svg></span>
            <span class="history-copy"><strong>أفكار لمحتوى إبداعي</strong><small>منذ 3 أيام · 15 رسالة</small></span>
          </button>
          <button class="history-item" type="button" data-conversation="neural">
            <span class="history-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="6" cy="7" r="2.2"/><circle cx="18" cy="7" r="2.2"/><circle cx="12" cy="17" r="2.2"/><path d="M8 8.5 10.5 15M16 8.5 13.5 15M8.2 7h7.6"/></svg></span>
            <span class="history-copy"><strong>شرح الشبكات العصبية</strong><small>الأسبوع الماضي</small></span>
          </button>
        </nav>
      </div>

      <div class="sidebar-footer">
        <div class="plan-card">
          <div class="plan-top"><span>الخطة المجانية</span><b>68%</b></div>
          <div class="plan-bar"><span></span></div>
          <p>لديك 32 رسالة متبقية اليوم</p>
          <button type="button" id="upgradeBtn">ترقية إلى Pro</button>
        </div>
        <button class="user-row" type="button" id="userBtn">
          <span class="avatar">ذ</span>
          <span class="user-copy"><strong>مستخدم ذكاء</strong><small>الخطة المجانية</small></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        </button>
      </div>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <main class="main">
      <header class="topbar">
        <div class="topbar-start">
          <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="فتح القائمة">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <button class="model-pill" type="button" id="modelBtn">
            <span class="live-dot"></span>
            <span>ذكاء 2.0</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m7 10 5 5 5-5"/></svg>
          </button>
        </div>
        <div class="topbar-actions">
          <span class="online"><i></i>متصل الآن</span>
          <button class="icon-btn" id="themeBtn" type="button" aria-label="تبديل المظهر">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
          </button>
          <button class="icon-btn" id="shareBtn" type="button" aria-label="مشاركة">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="m8.4 10.8 7.2-4.2M8.4 13.2l7.2 4.2"/></svg>
          </button>
        </div>
      </header>

      <section class="chat" id="chat">
        <div class="welcome" id="welcome">
          <div class="hero">
            <div class="hero-ring ring-one"></div>
            <div class="hero-ring ring-two"></div>
            <div class="hero-orb">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 2.8c.8 4.6 2.2 6 6.8 6.8-4.6.8-6 2.2-6.8 6.8-.8-4.6-2.2-6-6.8-6.8 4.6-.8 6-2.2 6.8-6.8Z" fill="currentColor"/><path d="M19 15.2c.4 2.2 1.1 2.9 3.3 3.3-2.2.4-2.9 1.1-3.3 3.3-.4-2.2-1.1-2.9-3.3-3.3 2.2-.4 2.9-1.1 3.3-3.3Z" fill="currentColor" opacity=".65"/></svg>
            </div>
          </div>
          <p class="eyebrow"><span></span>مساعدك الذكي بالعربية</p>
          <h1>كيف يمكنني مساعدتك اليوم؟</h1>
          <p class="subtitle">اسأل، اكتب، حلّل، أو ابتكر — أنا هنا لتحويل أفكارك إلى نتائج ملموسة.</p>

          <div class="suggestions" id="suggestions">
            <button class="suggestion" type="button" data-prompt="اكتب لي خطة تسويق كاملة لمنتج تقني ناشئ خلال 30 يومًا">
              <span class="suggestion-icon violet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 3c3.5 2 5 5 5 9l-5 3-5-3c0-4 1.5-7 5-9Z"/><path d="M9.5 15.5 8 21l4-2 4 2-1.5-5.5"/></svg></span>
              <span class="suggestion-copy"><strong>خطة تسويق متكاملة</strong><small>لمنتج تقني ناشئ خلال 30 يومًا</small></span>
              <span class="suggestion-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></span>
            </button>
            <button class="suggestion" type="button" data-prompt="حلّل بيانات المبيعات الشهرية واستخرج أهم الفرص والمخاطر">
              <span class="suggestion-icon cyan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 19V5M4 19h16"/><path d="m7 15 3.5-4 3 2.5L20 7"/></svg></span>
              <span class="suggestion-copy"><strong>تحليل بيانات المبيعات</strong><small>واستخراج أهم الفرص والمخاطر</small></span>
              <span class="suggestion-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></span>
            </button>
            <button class="suggestion" type="button" data-prompt="اشرح لي الشبكات العصبية بطريقة بسيطة مع أمثلة عملية">
              <span class="suggestion-icon amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z"/><path d="M4 5.5A2.5 2.5 0 0 1 6.5 8H19"/></svg></span>
              <span class="suggestion-copy"><strong>اشرح مفهومًا معقدًا</strong><small>بطريقة بسيطة مع أمثلة عملية</small></span>
              <span class="suggestion-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></span>
            </button>
            <button class="suggestion" type="button" data-prompt="اقترح أفكارًا إبداعية لحملة تسويقية على وسائل التواصل الاجتماعي">
              <span class="suggestion-icon rose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.9V17h5v-1.2c0-.8.4-1.5 1-1.9A6 6 0 0 0 12 3Z"/><path d="M9.5 20h5"/></svg></span>
              <span class="suggestion-copy"><strong>أفكار إبداعية</strong><small>لحملة تسويقية على وسائل التواصل</small></span>
              <span class="suggestion-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></span>
            </button>
          </div>
        </div>

        <div class="messages" id="messages" aria-live="polite"></div>
      </section>

      <div class="composer-wrap">
        <form class="composer" id="composer">
          <button class="icon-btn attach-btn" type="button" id="attachBtn" aria-label="إرفاق ملف">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <textarea id="input" rows="1" placeholder="اكتب رسالتك هنا..." aria-label="رسالتك" maxlength="4000"></textarea>
          <div class="composer-actions">
            <button class="icon-btn mic-btn" type="button" id="micBtn" aria-label="إدخال صوتي">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            </button>
            <button class="send-btn" type="submit" id="sendBtn" aria-label="إرسال" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4 9.5 14.5M20 4l-6.5 16-4-7-7-4L20 4Z"/></svg>
            </button>
          </div>
        </form>
        <p class="composer-hint">ذكاء قد يخطئ — تحقّق من المعلومات المهمة. <span>Enter للإرسال · Shift+Enter لسطر جديد</span></p>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
